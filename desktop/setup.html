<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>澍雨设置</title>
<style>body{font:16px/1.6 system-ui;background:#f2f6f2;color:#23322a;margin:0}main{max-width:720px;margin:40px auto;padding:24px}fieldset{border:1px solid #c8d8cf;background:white;padding:24px;margin:20px 0;border-radius:12px}label{display:block;margin-top:12px}input:not([type=checkbox]),select{box-sizing:border-box;width:100%;padding:10px}button{padding:12px 24px;background:#2f7d5a;color:white;border:0;border-radius:8px}.hint{font-size:14px;color:#52675a}</style></head><body><main>
<h1>澍雨 · {{setup_title}}</h1><p>配置保存在当前电脑。模型调用使用你自己的服务商账号及额度。</p>
<form method="post" action="/setup"><input type="hidden" name="token" value="{{token}}">
<fieldset {{account_hidden}} {{account_disabled}}><legend>首次创建账号</legend><label>用户名<input name="username" maxlength="100" required autocomplete="username"></label><label>密码<input type="password" name="password" minlength="8" maxlength="1024" required autocomplete="new-password"></label><label>确认密码<input type="password" name="confirm" minlength="8" maxlength="1024" required autocomplete="new-password"></label><p class="hint">密码中的空格会保留。演示账号认领后，原有园区和资料归属不变。</p></fieldset>
<fieldset><legend>模型服务（可跳过）</legend><label>HTTPS 服务地址<input name="providerUrl" value="{{providerUrl}}" placeholder="https://供应商地址/v1" maxlength="2048"></label><label>文字模型<input name="providerModel" value="{{providerModel}}" maxlength="256"></label><label>API Key<input type="password" name="providerKey" autocomplete="off" maxlength="8192" placeholder="留空保留已有 Key"></label><label><input type="checkbox" name="clearKey" value="yes">清除已有 Key（离线浏览仍可用）</label>
<p>仅勾选你明确允许发送资料的能力：</p><label><input type="checkbox" name="capability" value="text" {{text_checked}}>文字对话</label><label><input type="checkbox" name="capability" value="vision" {{vision_checked}}>图片分析（图片发送给服务商）</label><label>图片模型<input name="visionModel" value="{{visionModel}}" maxlength="256"></label><label><input type="checkbox" name="capability" value="asr" {{asr_checked}}>语音转写（音频发送给服务商）</label><label>语音模型<input name="asrModel" value="{{asrModel}}" maxlength="256"></label><label>语音接口<select name="asrAdapter"><option value="transcriptions">transcriptions</option><option value="input_audio" {{asr_input_selected}}>input_audio</option></select></label><p class="hint">未填写 Key 或未授权对应能力时，AI 会明确提示未配置。后续运行“模型设置”可修改，不改变账号密码或现有会话。</p></fieldset>
<button type="submit">保存并打开澍雨</button></form><p class="hint">关闭浏览器不会停止后台服务。退出请运行随包“停止澍雨”，重新配置请运行“模型设置”。数据位置：macOS ~/Library/Application Support/澍雨；Windows %LOCALAPPDATA%\澍雨。</p>
</main></body></html>
